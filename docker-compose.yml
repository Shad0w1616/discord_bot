services:

  notorious-bot:

    build:
      context: .

      dockerfile: Dockerfile


    container_name: notorious-bot


    restart: unless-stopped

    network_mode: host

    env_file:
      - .env


    volumes:

      # чтобы кэш yt-dlp сохранялся
      - yt_cache:/tmp/yt-dlp
      - ./cookies.txt:/app/cookies.txt


    environment:
      YTDLP_COOKIES_PATH: /app/cookies.txt

      PYTHONUNBUFFERED: "1"


    stdin_open: true

    tty: true



volumes:

  yt_cache: