services:
  notorious-bot:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: notorious-bot

    restart: unless-stopped

    network_mode: host

    env_file:
      - .env

    volumes:
      - yt_cache:/tmp/yt-dlp
      - bot_data:/app/data
      - ./cookies.txt:/app/cookies.txt

    environment:
      YTDLP_COOKIES_PATH: /app/cookies.txt
      QUEUE_STATE_PATH: /app/data/queues.json
      DAILY_VICTIMS_STATE_PATH: /app/data/daily_victims.json
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    stdin_open: true
    tty: true

volumes:
  yt_cache:
  bot_data:
